[package]
name = "automerge-wtransport"
version = "0.1.0"
edition = "2024"
default-run = "automerge-wtransport"

[dependencies]
lambda_runtime = { version = "=1.5.0", optional = true }
anyhow = "1"
automerge = "=0.12.0"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
rustls = { version = "0.23", features = ["ring"], default-features = false }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "=0.29.0", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
wtransport = "=0.7.2"

[features]
lambda = ["dep:lambda_runtime"]

[[bin]]
name = "lambda-client"
path = "src/bin/lambda-client.rs"
required-features = ["lambda"]
